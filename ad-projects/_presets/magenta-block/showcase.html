<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>magenta-block · showcase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{background:#2a2a2a;display:flex;justify-content:center;padding:20px;}
  /* 프리셋 토큰 (magenta-block/FRAME.md) */
  .stage{
    --bg:#ff3bff; --deep:#d11fc2; --dark:#7a0f86;
    --ink:#ffffff; --promise:#ffd400; --on-promise:#7a0f86;
    width:1080px;height:1920px;position:relative;overflow:hidden;
    background:var(--bg);font-family:'Pretendard Variable',sans-serif;color:var(--ink);
  }
  /* 색면 블록 — 하드 엣지(radius 0) */
  .block-deep{position:absolute;left:0;right:0;top:840px;height:520px;background:var(--deep);}
  .block-dark{position:absolute;left:0;right:0;top:1250px;height:280px;background:var(--dark);opacity:.55;}
  .top{position:absolute;top:110px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;z-index:2;}
  .brand .mark{font-weight:800;font-size:23px;letter-spacing:.22em;}
  .brand .sub{font-weight:500;font-size:20px;letter-spacing:.14em;margin-left:12px;opacity:.85;}
  .badge{font-weight:800;font-size:28px;color:var(--on-promise);background:var(--promise);
    border-radius:999px;padding:14px 26px;}
  .head{position:absolute;left:80px;right:80px;top:520px;z-index:2;}
  .head h1{font-weight:800;font-size:108px;line-height:1.12;letter-spacing:-.04em;}
  .head .em{color:var(--promise);}
  .wm{position:absolute;left:80px;bottom:360px;font-weight:600;font-size:19px;letter-spacing:.28em;color:rgba(255,255,255,.4);z-index:2;}
  .cta{position:absolute;left:0;right:0;bottom:0;background:var(--promise);padding:56px 80px 64px;z-index:2;
    display:flex;align-items:center;justify-content:space-between;gap:28px;color:var(--on-promise);}
  .cta .pre{font-weight:600;font-size:30px;opacity:.9;}
  .cta .big{font-weight:800;font-size:64px;letter-spacing:-.03em;margin-top:8px;}
  .cta .btn{flex:none;background:var(--on-promise);color:var(--promise);font-weight:800;font-size:31px;
    padding:26px 40px;border-radius:999px;white-space:nowrap;}
</style></head><body>
<div class="stage">
  <div class="block-deep"></div>
  <div class="block-dark"></div>
  <div class="top">
    <div class="brand"><span class="mark">SOMSS·</span><span class="sub">소옴크리에이티브 클래식과정</span></div>
    <div class="badge">65기 모집중</div>
  </div>
  <div class="head"><h1>커트는<br>기술이<br><span class="em">아닙니다</span></h1></div>
  <div class="wm">SOMSSCREATIVE</div>
  <div class="cta">
    <div class="txt">
      <div class="pre">클래식과정을 마치면</div>
      <div class="big">완전히 달라집니다</div>
    </div>
    <div class="btn">무료 상담 신청 →</div>
  </div>
</div>
</body></html>
