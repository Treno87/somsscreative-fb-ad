<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:'Pretendard';src:url('file:///home/ken/projects/somsscreative-fb-ad/remotion/public/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{width:1080px;height:1350px;}
.stage{width:1080px;height:1350px;position:relative;overflow:hidden;
  background:#f3ede3;font-family:'Pretendard',sans-serif;color:#1c1814;}
.frame{position:absolute;inset:40px;border:1px solid #cbbfa f;border:1px solid #cdc1ab;}
.top{position:absolute;top:84px;left:88px;right:88px;display:flex;align-items:center;justify-content:space-between;}
.eyebrow{font-weight:700;font-size:20px;letter-spacing:.34em;color:#8a7c63;}
.badge{font-weight:800;font-size:27px;color:#f3ede3;background:#1c1814;border-radius:999px;padding:13px 26px;letter-spacing:-.01em;}
.kicker{position:absolute;top:300px;left:88px;font-weight:600;font-size:27px;color:#a07b2e;letter-spacing:.02em;}
.kicker:before{content:"";display:inline-block;width:46px;height:2px;background:#a07b2e;vertical-align:middle;margin-right:16px;transform:translateY(-6px);}
.head{position:absolute;left:88px;top:360px;}
.head h1{font-weight:300;font-size:98px;line-height:1.22;letter-spacing:-.035em;color:#231d17;}
.head h1 b{font-weight:800;}
.em{font-weight:800;background:linear-gradient(transparent 66%,rgba(255,59,255,.34) 66%,rgba(255,59,255,.34) 92%,transparent 92%);}
.rule{position:absolute;left:88px;right:88px;bottom:286px;height:1px;background:#cdc1ab;}
.bottom{position:absolute;left:88px;right:88px;bottom:124px;display:flex;align-items:center;justify-content:space-between;}
.bottom .pre{font-weight:500;font-size:29px;color:#6b5f4c;}
.bottom .big{font-weight:800;font-size:56px;letter-spacing:-.03em;color:#231d17;margin-top:4px;}
.bottom .big .g{color:#a07b2e;}
.btn{flex:none;background:#231d17;color:#f3ede3;font-weight:800;font-size:30px;
  padding:24px 38px;border-radius:999px;display:flex;align-items:center;gap:14px;white-space:nowrap;}
.wm{position:absolute;left:88px;bottom:74px;font-weight:700;font-size:18px;letter-spacing:.3em;color:#a99c83;}
</style></head><body>
<div class="stage">
  <div class="frame"></div>
  <div class="top">
    <div class="eyebrow">SOMSSCREATIVE · CLASSIC COURSE</div>
    <div class="badge">7월 20일 개강반 모집중</div>
  </div>
  <div class="kicker">소움크리에이티브 클래식과정</div>
  <div class="head"><h1>분명히 배웠는데<br>커트실력은 왜<br><span class="em">제자리</span>일까요?</h1></div>
  <div class="rule"></div>
  <div class="bottom">
    <div class="txt">
      <div class="pre">클래식과정을 마치면</div>
      <div class="big">완전히 <span class="g">달라집니다</span></div>
    </div>
    <div class="btn">무료 상담 신청<span>→</span></div>
  </div>
  <div class="wm">SOMSSCREATIVE</div>
</div>
</body></html>
