<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:'Pretendard';src:url('file:///home/ken/projects/somsscreative-fb-ad/remotion/public/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{width:1080px;height:1350px;}
.stage{width:1080px;height:1350px;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#ff3bff 0%,#d11fc2 52%,#7a0f86 100%);
  font-family:'Pretendard',sans-serif;color:#fff;}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;top:-360px;right:-260px;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 60%);}
.qmark{position:absolute;font-weight:800;font-size:760px;line-height:1;right:-40px;bottom:-160px;
  color:rgba(255,255,255,.09);letter-spacing:-.05em;}
.top{position:absolute;top:64px;left:72px;right:72px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-weight:800;font-size:22px;letter-spacing:.2em;}
.brand span{font-weight:500;color:rgba(255,255,255,.78);letter-spacing:.02em;margin-left:12px;}
.badge{font-weight:800;font-size:28px;color:#7a0f86;background:#ffd400;border-radius:999px;padding:14px 26px;letter-spacing:-.01em;}
.head{position:absolute;left:72px;top:286px;}
.head h1{font-weight:800;font-size:108px;line-height:1.14;letter-spacing:-.04em;text-shadow:0 6px 40px rgba(80,0,70,.3);}
.head h1 .em{color:#ffd400;}
.bottom{position:absolute;left:72px;right:72px;bottom:120px;}
.bottom .pre{font-weight:600;font-size:30px;color:rgba(255,255,255,.85);}
.bottom .big{font-weight:800;font-size:74px;letter-spacing:-.035em;color:#fff;margin-top:6px;
  text-shadow:0 6px 30px rgba(80,0,70,.3);}
.bottom .btn{display:inline-flex;align-items:center;gap:16px;margin-top:30px;
  background:#ffd400;color:#171310;font-weight:800;font-size:33px;padding:26px 44px;border-radius:999px;
  box-shadow:0 14px 50px rgba(60,0,55,.38);}
.wm{position:absolute;right:72px;bottom:60px;font-weight:700;font-size:18px;letter-spacing:.28em;color:rgba(255,255,255,.55);}
</style></head><body>
<div class="stage">
  <div class="glow"></div>
  <div class="qmark">?</div>
  <div class="top">
    <div class="brand">SOMSS·<span>소움크리에이티브 클래식과정</span></div>
    <div class="badge">7월 20일 개강반 모집중</div>
  </div>
  <div class="head"><h1>분명히 배웠는데<br>커트실력은 왜<br><span class="em">제자리</span>일까요?</h1></div>
  <div class="bottom">
    <div class="pre">클래식과정을 마치면</div>
    <div class="big">완전히 달라집니다</div>
    <div class="btn">무료 상담 신청<span>→</span></div>
  </div>
  <div class="wm">SOMSSCREATIVE</div>
</div>
</body></html>
